# Jinfer integration test configuration.
# Disabled by default so the application assembles and boots without downloading a model.
# To exercise real inference, set enable-integration=true and run on JDK 25 with
#   --add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED
quarkus.langchain4j.jinfer.enable-integration=false
quarkus.langchain4j.jinfer.chat-model.model=mukel/Llama-3.2-1B-Instruct-GGUF:Q8_0
# The named models injected by JinferRealModelsIT follow the switch above: enable-integration is per configuration,
# so a new @ModelName in that test needs its own line here, or every test in this module fails to start.
quarkus.langchain4j.jinfer.short.enable-integration=${quarkus.langchain4j.jinfer.enable-integration}
quarkus.langchain4j.jinfer.d3.enable-integration=${quarkus.langchain4j.jinfer.enable-integration}
quarkus.langchain4j.jinfer.vision.enable-integration=${quarkus.langchain4j.jinfer.enable-integration}
quarkus.langchain4j.jinfer.timed.enable-integration=${quarkus.langchain4j.jinfer.enable-integration}
quarkus.langchain4j.jinfer.race.enable-integration=${quarkus.langchain4j.jinfer.enable-integration}
